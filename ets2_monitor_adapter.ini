[adapter]
; Monitor the game should treat as its primary display (DXGI output #0).
;   auto              first desktop monitor that is not the Windows primary (default)
;   AOCB305           substring of the monitor's device id (see README: "Finding your monitor id")
;   \\.\DISPLAY5      GDI display name (can change when monitors are re-plugged)
monitor=auto

; Move the GPU that drives the target monitor to adapter #0 / the target monitor to output #0.
reorder_adapters=1
reorder_outputs=1

; Remap Win32 monitor queries and window placement inside eurotrucks2.exe so the target
; monitor looks like the primary one (needed for the window to actually open there).
hook_win32=1

; Write ets2_monitor_adapter.log next to the DLL.
log=0
